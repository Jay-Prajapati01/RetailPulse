name: RetailPulse Docker Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - 'retailpulse_dashboard.py'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: streamlit
            dockerfile: docker/Dockerfile.streamlit
            image: ghcr.io/${{ github.repository }}/retailpulse-streamlit
          - name: mlflow
            dockerfile: docker/Dockerfile.mlflow
            image: ghcr.io/${{ github.repository }}/retailpulse-mlflow
          - name: airflow
            dockerfile: docker/Dockerfile.airflow
            image: ghcr.io/${{ github.repository }}/retailpulse-airflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
